# Fuse Android — signed release APK build (manual only).
#
# Trigger: manual Run workflow only. Builds happen on the user's
# instruction, never on push.
#
# Signing: the release keystore lives in GitHub Secrets, never in the
# repo. android/app/build.gradle.kts reads key.properties, which this
# workflow writes from secrets:
#   ANDROID_KEYSTORE_BASE64   — base64 of fuse-release-keystore.jks
#   ANDROID_KEYSTORE_PASSWORD — store password (== key password)
#   ANDROID_KEY_ALIAS         — fuse
#   ANDROID_KEY_PASSWORD      — key password
# Without the keystore secret the job fails fast: the build file falls
# back to DEBUG signing without key.properties, and a debug-signed APK
# must never ship as a release.
#
# Dart-defines: TMDB_API_KEY + WETRAKR_CLIENT_ID come from repo secrets
# (same as the iOS workflow). The build succeeds without them, with a
# warning — Browse just has no TMDB rows and the WeTrakr row hides.
#
# Flutter version: 3.47.7, the version upstream's iOS workflow pins for
# this exact codebase.

name: Build Fuse Android (Release APK)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  android:
    name: Android Release APK (signed)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      # Fail fast without the signing secrets: the build file would
      # silently fall back to DEBUG signing, and a debug-signed APK must
      # never ship as the release.
      - name: Write signing key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 is not set: add the release keystore secret first"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/fuse-release.keystore
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" "fuse-release.keystore" > android/key.properties
          echo "key.properties written."

      - name: Build Release APK (arm64-only)
        env:
          WETRAKR_CLIENT_ID: ${{ secrets.WETRAKR_CLIENT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$WETRAKR_CLIENT_ID" ]; then echo "::warning::WETRAKR_CLIENT_ID is not set: the WeTrakr row will be hidden"; fi
          if [ -z "$TMDB_API_KEY" ]; then echo "::warning::TMDB_API_KEY is not set: Browse will have no TMDB Movies & Shows"; fi
          flutter build apk --release --target-platform android-arm64 --dart-define=WETRAKR_CLIENT_ID="$WETRAKR_CLIENT_ID" --dart-define=TMDB_API_KEY="$TMDB_API_KEY"
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      # The build file warns but still builds (debug-signed) without a
      # keystore; this step proves the APK actually carries the Fuse
      # release key before it is handed over as an artifact.
      - name: Verify release signature
        run: |
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -q "Owner: CN=Fuse" && echo "APK signed with the Fuse release key" || { echo "::error::APK is not signed with the Fuse release key"; exit 1; }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true # Artifact quota can be full (account-wide
          # 500 MB free tier); a failed upload must not fail the build.
        with:
          name: Fuse-Android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
