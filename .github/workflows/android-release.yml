# Fuse Android — signed release APK build (manual only).
#
# Trigger: manual Run workflow only. Builds happen on the user's
# instruction, never on push.
#
# Signing: the release keystore lives in GitHub Secrets, never in the
# repo. android/app/build.gradle.kts reads key.properties, which this
# workflow writes from secrets:
#   ANDROID_KEYSTORE_BASE64   — base64 of fuse-release-keystore.jks
#   ANDROID_KEYSTORE_PASSWORD — store password (== key password)
#   ANDROID_KEY_ALIAS         — fuse
#   ANDROID_KEY_PASSWORD      — key password
# Without the keystore secret the job fails fast: the build file falls
# back to DEBUG signing without key.properties, and a debug-signed APK
# must never ship as a release.
#
# Dart-defines: TMDB_API_KEY + WETRAKR_CLIENT_ID come from repo secrets
# (same as the iOS workflow). Both are optional — the same values are
# entered in the app (Settings), which is how they are actually used.
#
# Flutter version: 3.47.7, the version upstream's iOS workflow pins for
# this exact codebase.

name: Build Fuse Android (Release APK)

on:
  workflow_dispatch:

permissions:
  contents: write # Draft GitHub Release creation needs write; the
    # release is a draft (owner-only) with no assets attached — the
    # APK stays on the Actions artifact only.

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  android:
    name: Android Release APK (signed)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle had no cache at all: every run re-downloaded the Gradle
      # distribution + all Maven dependencies and recompiled Kotlin +
      # R8 from scratch — that is why the build step alone took 14 of
      # the run's 16 minutes (run 45659719796: Build Release APK 851 s).
      # setup-gradle caches the dependencies and the Gradle build cache
      # (task outputs) in the Actions cache, so a warm run reuses them.
      # The first run after this still builds the cache and stays slow;
      # the runs after it are the fast ones.
      - uses: gradle/actions/setup-gradle@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # The pub cache: `flutter pub get` re-downloaded every package on
      # each run. Keyed on pubspec.lock, so a dependency change busts it.
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      # Fail fast without the signing secrets: the build file would
      # silently fall back to DEBUG signing, and a debug-signed APK must
      # never ship as the release.
      - name: Write signing key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 is not set: add the release keystore secret first"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/fuse-release.keystore
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" "fuse-release.keystore" > android/key.properties
          echo "key.properties written."

      - name: Build Release APK (arm64-only)
        env:
          WETRAKR_CLIENT_ID: ${{ secrets.WETRAKR_CLIENT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          flutter build apk --release --target-platform android-arm64 --dart-define=WETRAKR_CLIENT_ID="$WETRAKR_CLIENT_ID" --dart-define=TMDB_API_KEY="$TMDB_API_KEY"
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      # The build file warns but still builds (debug-signed) without a
      # keystore; this step proves the APK actually carries the Fuse
      # release key before it is handed over as an artifact. apksigner,
      # not keytool -printcert -jarfile: keytool reads the v1 (JAR)
      # signature, which a modern AGP build does not reliably carry,
      # so the keytool check failed on a correctly signed APK (run
      # 45607443765). apksigner reads v1/v2/v3 and prints the signer
      # certificate, so the log shows who signed it; the SHA-256
      # fingerprint below is the Fuse release key's (a public identifier
      # of the key, printed in every APK signed with it).
      # Key rotated 2026-11-26: the 2026-11-25 key's password was lost, so a
      # new keystore was issued; the old keystore is preserved locally as
      # fuse-release-keystore-OLD-2026-11-26.jks. APKs signed with the new
      # key do NOT update over build #18 — uninstall first.
      - name: Verify release signature
        run: |
          APKSIGNER=$(ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then echo "::error::apksigner not found in the Android SDK"; exit 1; fi
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee /tmp/apksigner-certs.txt
          grep -q "b22e7a906d83bd06cd52f86393887ee35bc6f0896af76122c3be1726c0519e63" /tmp/apksigner-certs.txt && echo "APK signed with the Fuse release key" || { echo "::error::APK is not signed with the Fuse release key"; exit 1; }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true # Artifact quota can be full (account-wide
          # 500 MB free tier); a failed upload must not fail the build.
        with:
          name: Fuse-Android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # Draft GitHub Release, owner-only, with NO assets attached: the
      # APK is downloaded from the Actions artifact above, never from
      # the release. A draft is visible only to people with write
      # access to the repo (the owner). Tag is unique per run so a
      # re-run never collides with an existing tag.
      - name: Create draft GitHub Release (owner-only, no assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          TAG="v${VERSION}-build-${{ github.run_number }}"
          gh release create "$TAG" --draft --title "Fuse Android $VERSION (build ${{ github.run_number }})" --notes "Draft release. The APK is available from the Actions artifact (Fuse-Android-release), not attached here."
